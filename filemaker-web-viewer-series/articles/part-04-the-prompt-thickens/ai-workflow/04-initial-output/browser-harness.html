<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Article 4 Hybrid Renderer Harness</title>
  <style>
    html,body{min-height:100%;margin:0;background:#0d1217;color:#eef1f4;font-family:system-ui,sans-serif}
    .harness{padding:12px}.harness button{margin-right:8px}.harness pre{white-space:pre-wrap;color:#aeb8c2}
  </style>
</head>
<body>
  <div class="harness">
    <button id="loadPopulated">Load populated context</button>
    <button id="loadEmpty">Load empty context</button>
    <pre id="actionLog">No action sent.</pre>
  </div>
  <section class="wv-hybrid-page" data-wv-page="hybrid-rating">
    <div class="wv-hybrid-loading" role="status">Loading rating distribution…</div>
  </section>
  <script>
    window.WV = {
      registerRenderer: function (fn) { this.render = fn; },
      sendAction: function (type, payload, options) {
        document.getElementById("actionLog").textContent = JSON.stringify({ type:type, payload:payload, options:options }, null, 2);
        return "harness";
      }
    };
    window.sampleContext = {
      __wv: { contract_version: 1, page: 43, page_name: "hybrid_rating" },
      ranked_view: {
        native_found_count: 12,
        selected_movie_id: "MOVIE-4",
        rating_band: { active: false, rating_lo: null, rating_hi: null, label: "All ratings" },
        rows: [
          ["MOVIE-1","AL: Twilight Cargo (2015)",1499.92,1],
          ["MOVIE-2","BA: Glass Harbor (2017)",1499.61,2],
          ["MOVIE-3","CR: Static Moon (2013)",1499.34,3],
          ["MOVIE-4","AX: Amber Void (2018)",1499.12,4],
          ["MOVIE-5","DA: Red Signal (2021)",1498.83,5],
          ["MOVIE-6","EL: Quiet Orbit (2016)",1498.44,6],
          ["MOVIE-7","FA: Hollow Engine (2019)",1498.08,7],
          ["MOVIE-8","GI: Pale Vector (2014)",1497.81,8],
          ["MOVIE-9","HA: Soft Collision (2020)",1497.43,9],
          ["MOVIE-10","IR: Night Archive (2012)",1497.06,10],
          ["MOVIE-11","JA: Borrowed Sky (2022)",1496.72,11],
          ["MOVIE-12","KA: Signal Garden (2011)",1496.31,12]
        ].map(function (r) { return { movie_id:r[0], display_title:r[1], rating:r[2], rank:r[3], selected:r[0] === "MOVIE-4" }; })
      }
    };
  </script>
  <script src="wv.renderer.hybrid.rating.js"></script>
  <script>
    document.getElementById("loadPopulated").addEventListener("click", function () { WV.render(window.sampleContext); });
    document.getElementById("loadEmpty").addEventListener("click", function () { WV.render({ ranked_view: { rows: [], empty_message: "No ranked movies match Sci-Fi." } }); });
    WV.render(window.sampleContext);
  </script>
</body>
</html>
